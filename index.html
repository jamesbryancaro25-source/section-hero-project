
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Luxury Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            THE <span>LUXURY</span> HOTEL
        </div>

        <nav class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Rooms</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="nav-button">
            <a href="#">Book Now</a>
        </div>
    </header>

    <main>
        <section class="hero">

            <div class="hero-content">
                <span class="subtitle">
                    WELCOME TO THE LUXURY HOTEL
                </span>

                <h1>
                    Experience Luxury
                    <span>Beyond Expectations</span>
                </h1>

                <p>
                    Discover a world of comfort, elegance, and
                    unforgettable experiences. Your perfect getaway
                    begins here at The Luxury Hotel.
                </p>

                <div class="hero-buttons">
                    <a href="#" class="primary-btn">
                        Book Your Stay
                    </a>

                    <a href="#" class="secondary-btn">
                        Explore More
                    </a>
                </div>
            </div>

            <div class="hero-image">
                <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945"
                     alt="Luxury hotel swimming pool">
            </div>

        </section>
    </main>

</body>
</html>
